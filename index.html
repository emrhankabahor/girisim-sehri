.eot-v2-quick-head{margin-top:20px}.eot-v2-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.eot-v2-actions a{min-height:68px;padding:11px;border:1px solid rgba(93,136,171,.3);border-radius:17px;background:linear-gradient(140deg,#153657,#102b48);display:grid;grid-template-columns:30px 1fr 12px;align-items:center;gap:8px}.eot-v2-actions>a:nth-child(2){background:linear-gradient(140deg,#123b48,#11475c)}.eot-v2-actions>a:nth-child(3){background:linear-gradient(140deg,#302b55,#1c2a4b)}.eot-v2-actions>a:nth-child(4){background:linear-gradient(140deg,#32364b,#1d2b41)}.eot-v2-actions> a > span{font-size:20px}.eot-v2-actions div{min-width:0}.eot-v2-actions b{display:block;font-size:9.5px}.eot-v2-actions small{display:block;margin-top:3px;font-size:7px;color:#7890a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eot-v2-actions strong{font-size:18px;color:#8fcfee}.eot-v2-market-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.eot-v2-market-strip>div{padding:10px 11px;border:1px solid rgba(84,120,151,.22);border-radius:14px;background:rgba(13,32,51,.75)}.eot-v2-market-strip span{display:block;font-size:6.5px;color:#6b879f;letter-spacing:.08em}.eot-v2-market-strip b{display:block;margin-top:4px;font-size:8.5px;color:#c6dceb}
