name: iOS Dev Wrapper Build

on:
  workflow_dispatch:
  push:
    branches:
      - ios-dev-wrapper
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "www/**"
      - ".github/workflows/ios-dev-wrapper-build.yml"

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build simulator
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
