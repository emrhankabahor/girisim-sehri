name: Generate PWA Icons

on:
  push:
    paths:
      - '.github/workflows/generate-pwa-icons.yml'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Generate PNG icons
        run: |
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 180 -h 180 icon.svg -o apple-touch-icon.png
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png apple-touch-icon.png
          git commit -m "Generate PWA icons" || exit 0
          git push
